theme: jekyll-theme-cayman
title: 个人 AI 日报
description: 每日筛选与解读值得关注的 AI 和科技动态。
url: "https://jojonothing.github.io"
baseurl: "/horizon-personal-news-site"

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
